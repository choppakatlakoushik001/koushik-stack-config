# ~/.tmux.conf — set up for the kunchen agent-crew workflow (firstmate et al.)
# Every line here is overridable: edit this file, then `tmux source-file ~/.tmux.conf`.

# --- Quality of life ---------------------------------------------------------
set -g mouse on                          # click panes/windows, scroll naturally
set -g set-clipboard on                  # mouse-drag selection -> system clipboard (needed since mouse on captures selection before Alacritty's own copy can)
set -g history-limit 100000              # long scrollback for agent output
set -g base-index 1                      # windows start at 1 (matches keyboard row)
setw -g pane-base-index 1
set -g renumber-windows on               # keep window numbers gapless
set -g escape-time 10                    # snappy ESC (helps vim/agents)
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # true color

# --- Status bar: see the whole crew at a glance ------------------------------
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left "#[bold]#S #[default]| "
set -g status-left-length 30
set -g status-right "%Y-%m-%d %H:%M"
setw -g window-status-current-style "bold fg=#7aa2f7"
setw -g automatic-rename on              # firstmate names crew windows fm-<task>

# --- Activity: notice when a crewmate needs attention ------------------------
setw -g monitor-activity on
set -g visual-activity off               # highlight in status bar, no popup spam

# --- Sane splits (keep prefix C-b default so docs/videos match) --------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ===== PERSISTENCE BEGIN (managed; safe to edit or delete) =====
# Satisfies "persistent background sessions" across a reboot or `wsl --shutdown`.
# Without this, the WSL VM going away takes your whole session layout with it.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore more than window names: working directories, pane layout, and the
# text that was on screen. Without capture-pane-contents a restored session
# looks right but is blank, which is worse than useless when you are trying
# to remember what you were doing.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'      # reopen the files nvim had

# Automatic save every 15 min, and restore when the tmux server starts.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Save/restore on demand: prefix + Ctrl-s  /  prefix + Ctrl-r
# (bindings come from tmux-resurrect)

# tpm MUST be the last line in this file.
run '~/.tmux/plugins/tpm/tpm'
# ===== PERSISTENCE END =====
